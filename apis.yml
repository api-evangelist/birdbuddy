aid: birdbuddy
name: BirdBuddy
description: >-
  Bird Buddy (Buddy Bird Inc, backed by General Catalyst) makes the world's
  most recognized smart bird feeder and companion mobile app for discovering
  and learning about birds. An AI vision-and-sound model identifies bird
  species from the photos and audio captured by its camera feeders, notifies
  owners of feathered visitors, and organizes captures into a personal
  collection with postcards and monthly reports. Bird Buddy does not publish
  an official public API; the app is powered by a private, account-
  authenticated GraphQL backend hosted on AWS, which the community has
  reverse-engineered through the third-party pybirdbuddy Python library and a
  Home Assistant integration.
